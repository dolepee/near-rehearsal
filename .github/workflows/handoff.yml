name: Handoff checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/sputnik-release-review

permissions:
  contents: read

jobs:
  non-sandbox:
    name: Non-Sandbox handoff checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['24.22.1', '26.4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run offline core checks
        run: npm test

  sandbox:
    name: Pinned Sandbox three-branch flow
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Patch sandbox binary resolution
        run: node scripts/patch-near-sandbox.cjs
      - name: Acquire pinned NEAR Sandbox 2.6.2
        run: |
          set -euo pipefail
          sandbox_dir="$RUNNER_TEMP/near-sandbox-2.6.2"
          mkdir -p "$sandbox_dir"
          curl -fsSL \
            https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.6.2/near-sandbox.tar.gz \
            -o "$sandbox_dir/near-sandbox.tar.gz"
          echo "58c6d71091bc7a329b9d90784be42d1f313e0bf9fc4e1f2b967d60cdc407cdcf  $sandbox_dir/near-sandbox.tar.gz" \
            | sha256sum -c -
          tar --no-same-owner -xzf "$sandbox_dir/near-sandbox.tar.gz" -C "$sandbox_dir"
          chmod +x "$sandbox_dir/Linux-x86_64/near-sandbox"
          echo "NEAR_SANDBOX_BIN_PATH=$sandbox_dir/Linux-x86_64" >> "$GITHUB_ENV"
          echo "NEAR_SANDBOX_BINARY_PATH=$sandbox_dir/Linux-x86_64" >> "$GITHUB_ENV"
      - name: Run pinned three-branch flow
        run: |
          set -euo pipefail
          ulimit -n 65535
          run_dir="$RUNNER_TEMP/sputnik-local"
          mkdir -p "$run_dir/out"
          SPUTNIK_OUT_DIR="$run_dir/out" node case-triage/sputnik-public-capture/local-three-branch.cjs
          CASE_DIR="$run_dir" node case-triage/sputnik-public-capture/verify-local-three.cjs
          CASE_DIR="$run_dir" node case-triage/sputnik-public-capture/negative-local-verifier-tests.cjs

  repair:
    name: Repair suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Rust 1.86.0
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.86.0
          fi
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
          cargo --version
          rustc --version
      - name: Run Repair suites
        run: |
          set -euo pipefail
          node case-triage/rehearsal-repair/codex-producer-tests.cjs
          node case-triage/rehearsal-repair/model-producer-tests.cjs
          node case-triage/rehearsal-repair/controller-tests.cjs
          node case-triage/rehearsal-repair/acceptance.cjs
          node case-triage/rehearsal-repair/acceptance-tests.cjs
          node case-triage/rehearsal-repair/pipeline-guards-tests.cjs
          node ui/sputnik/test-repair-job.cjs
          node ui/sputnik/test-repair-pipeline-failure.cjs
          node ui/sputnik/test-repair-history.cjs
          node ui/sputnik/test-repair-ui.cjs
          node ui/sputnik/test-repair-recovery-integration.cjs

  repair-review-source-build:
    name: Source-build repair handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Rust 1.86.0 and wasm32
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.86.0
          fi
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          rustup toolchain install 1.86.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.86.0
          rustup default 1.86.0
          cargo --version
          rustc --version
      - name: Check out exact upstream source
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/sputnik-dao-contract"
          git clone --quiet https://github.com/near-daos/sputnik-dao-contract.git "$source_dir"
          git -C "$source_dir" checkout --quiet 5434a59dec23ee0c49df8c8c4350c208a7e75b0b
          test "$(git -C "$source_dir" rev-parse HEAD)" = 5434a59dec23ee0c49df8c8c4350c208a7e75b0b
          test -z "$(git -C "$source_dir" status --porcelain --untracked-files=all)"
          echo "REPAIR_REVIEW_SOURCE=$source_dir" >> "$GITHUB_ENV"
      - name: Acquire pinned NEAR Sandbox 2.14.0
        run: |
          set -euo pipefail
          sandbox_dir="$RUNNER_TEMP/near-sandbox-2.14.0"
          mkdir -p "$sandbox_dir"
          curl -fsSL \
            https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0/near-sandbox.tar.gz \
            -o "$sandbox_dir/near-sandbox.tar.gz"
          echo "a0ba004218b218bd74351795e7ce2eda4a2b6af5cd3e252bd5e8bfe3c8f2e691  $sandbox_dir/near-sandbox.tar.gz" \
            | sha256sum -c -
          tar --no-same-owner -xzf "$sandbox_dir/near-sandbox.tar.gz" -C "$sandbox_dir"
          chmod +x "$sandbox_dir/Linux-x86_64/near-sandbox"
          echo "REPAIR_SANDBOX_DIR=$sandbox_dir/Linux-x86_64" >> "$GITHUB_ENV"
      - name: Run actual repair review source build
        run: |
          set -euo pipefail
          ulimit -n 65535
          out_dir="$RUNNER_TEMP/repair-review"
          test ! -e "$out_dir"
          npm run repair:review -- \
            --bundle test-fixtures/repair-browser-export-1de7b8c5.json \
            --out "$out_dir" \
            --source "$REPAIR_REVIEW_SOURCE" 2>&1 | tee "$RUNNER_TEMP/repair-review.log"
          test -s "$out_dir/review-result.json"
          test -s "$out_dir/source-build/pipeline.json"
          test -s "$out_dir/source-build/candidate-identity.json"
          test -s "$out_dir/source-build/persisted/persisted-recovery.json"
          test -s "$out_dir/source-build/persisted/persisted-recovery-acceptance.json"
      - name: Run actual repair review recorded replay
        run: |
          set -euo pipefail
          ulimit -n 65535
          out_dir="$RUNNER_TEMP/repair-replay"
          test ! -e "$out_dir"
          npm run repair:review -- \
            --bundle test-fixtures/repair-browser-export-1de7b8c5.json \
            --out "$out_dir" \
            --mode recorded-wasm 2>&1 | tee "$RUNNER_TEMP/repair-replay.log"
          test -s "$out_dir/review-result.json"
          test -s "$out_dir/recorded-replay/persisted-recovery.json"
          test -s "$out_dir/recorded-replay/persisted-recovery-acceptance.json"
      - name: Upload repair review evidence
        uses: actions/upload-artifact@v4
        with:
          name: repair-review-source-build
          path: |
            ${{ runner.temp }}/repair-review.log
            ${{ runner.temp }}/repair-replay.log
            ${{ runner.temp }}/repair-review/review-result.json
            ${{ runner.temp }}/repair-review/source-build/pipeline.json
            ${{ runner.temp }}/repair-review/source-build/candidate-identity.json
            ${{ runner.temp }}/repair-review/source-build/persisted/persisted-recovery.json
            ${{ runner.temp }}/repair-review/source-build/persisted/persisted-recovery-acceptance.json
            ${{ runner.temp }}/repair-replay/review-result.json
            ${{ runner.temp }}/repair-replay/recorded-replay/persisted-recovery.json
            ${{ runner.temp }}/repair-replay/recorded-replay/persisted-recovery-acceptance.json
          if-no-files-found: error

  persisted-recovery:
    name: Persisted bond recovery (Sandbox 2.14.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Patch sandbox binary resolution
        run: node scripts/patch-near-sandbox.cjs
      - name: Acquire pinned NEAR Sandbox 2.14.0
        run: |
          set -euo pipefail
          sandbox_dir="$RUNNER_TEMP/near-sandbox-2.14.0"
          mkdir -p "$sandbox_dir"
          curl -fsSL \
            https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0/near-sandbox.tar.gz \
            -o "$sandbox_dir/near-sandbox.tar.gz"
          echo "a0ba004218b218bd74351795e7ce2eda4a2b6af5cd3e252bd5e8bfe3c8f2e691  $sandbox_dir/near-sandbox.tar.gz" \
            | sha256sum -c -
          tar --no-same-owner -xzf "$sandbox_dir/near-sandbox.tar.gz" -C "$sandbox_dir"
          chmod +x "$sandbox_dir/Linux-x86_64/near-sandbox"
          echo "NEAR_SANDBOX_BIN_PATH=$sandbox_dir/Linux-x86_64" >> "$GITHUB_ENV"
          echo "NEAR_SANDBOX_BINARY_PATH=$sandbox_dir/Linux-x86_64" >> "$GITHUB_ENV"
          echo "NEAR_SANDBOX_VERSION=2.14.0" >> "$GITHUB_ENV"
      - name: Run persisted recovery tests
        run: node case-triage/rehearsal-repair/persisted-recovery-tests.cjs
      - name: Run persisted recovery chain
        run: |
          set -euo pipefail
          ulimit -n 65535
          node case-triage/rehearsal-repair/persisted-recovery.cjs \
            --sandbox-dir "$NEAR_SANDBOX_BIN_PATH" \
            --candidate-wasm case-triage/rehearsal-repair/generated/e8262f5a/candidate.wasm \
            --candidate-patch case-triage/rehearsal-repair/generated/e8262f5a/repair.patch \
            --candidate-identity case-triage/rehearsal-repair/generated/e8262f5a/candidate-identity.json \
            --expected-wasm-sha256 49a5120cee5f4e453a37e40b18231ce9b0fef95c08dca4fdbf23f102937eb923 \
            --out "$RUNNER_TEMP/persisted-recovery"
      - name: Verify persisted recovery
        run: |
          set -euo pipefail
          node case-triage/rehearsal-repair/persisted-recovery-acceptance.cjs \
            --report "$RUNNER_TEMP/persisted-recovery/persisted-recovery.json" \
            --wasm case-triage/rehearsal-repair/generated/e8262f5a/candidate.wasm \
            --base-wasm case-triage/rehearsal-repair/bundle/artifacts/base.wasm \
            --expected-wasm-sha256 49a5120cee5f4e453a37e40b18231ce9b0fef95c08dca4fdbf23f102937eb923 \
            --expected-patch-sha256 532741a3f689863844d0af147ec08d278420cd74920f68f817234747e295fedc \
            --expected-source-sha256 82efc4225e307b97068cd7bd984da78f9a83ecf51e1b21749de344f45aa53b22 \
            --patch case-triage/rehearsal-repair/generated/e8262f5a/repair.patch
      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: persisted-bond-recovery
          path: ${{ runner.temp }}/persisted-recovery/persisted-recovery.json
          if-no-files-found: error
